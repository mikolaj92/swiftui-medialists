name: SwiftUIMediaLists
options:
  bundleIdPrefix: dev.swiftuimedialists
  deploymentTarget:
    iOS: "26.0"
packages:
  SwiftUIMediaLists:
    path: .
targets:
  MediaListsDemo:
    type: application
    platform: iOS
    sources:
      - Demo
    dependencies:
      - package: SwiftUIMediaLists
        product: SwiftUIMediaLists
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftuimedialists.demo
        INFOPLIST_FILE: Demo/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
